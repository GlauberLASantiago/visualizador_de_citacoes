<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citação por categoria</title>
</head>
<body>
  <h1>Citação por categoria</h1>

  <select id="categoria">
    <option value="musica">Música</option>
    <option value="educacao">Educação</option>
    <option value="tecnologia">Tecnologia</option>
  </select>

  <button id="btn">Buscar citação</button>

  <blockquote id="citacao">Escolha uma categoria.</blockquote>
  <p id="autor"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://vpishybqzeflcvkdbhlq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_kWSkLBhVi1O0IKljgdko_A_Io1YFJr1";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const categoriaEl = document.getElementById("categoria");
    const citacaoEl = document.getElementById("citacao");
    const autorEl = document.getElementById("autor");
    const btn = document.getElementById("btn");

    async function carregarCitacao() {
      const categoria = categoriaEl.value;

      const { data, error } = await supabaseClient.rpc("obter_citacao_por_categoria", {
        categoria_escolhida: categoria
      });

      if (error) {
        citacaoEl.textContent = "Erro ao carregar.";
        autorEl.textContent = error.message;
        return;
      }

      if (!data || data.length === 0) {
        citacaoEl.textContent = "Nenhuma citação encontrada nessa categoria.";
        autorEl.textContent = "";
        return;
      }

      citacaoEl.textContent = data[0].texto;
      autorEl.textContent = data[0].autor ? "— " + data[0].autor : "";
    }

    btn.addEventListener("click", carregarCitacao);
  </script>
</body>
</html>
