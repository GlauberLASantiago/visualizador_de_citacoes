<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Citação sobre Música</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
}

blockquote{
    font-size: 24px;
    margin: 30px auto;
    max-width: 600px;
}

#autor{
    font-style: italic;
    margin-bottom: 30px;
}

button{
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}
</style>

</head>

<body>

<h1>Citação sobre Música</h1>

<blockquote id="citacao">
Carregando citação...
</blockquote>

<p id="autor"></p>

<button id="nova">Nova citação</button>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// COLOQUE AQUI OS DADOS DO SEU PROJETO
const SUPABASE_URL = "https://vpishybqzeflcvkdbhlq.supabase.co"
const SUPABASE_KEY = "sb_publishable_kWSkLBhVi1O0IKljgdko_A_Io1YFJr1"

// conecta ao supabase
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

// elementos do html
const citacaoEl = document.getElementById("citacao")
const autorEl = document.getElementById("autor")
const botao = document.getElementById("nova")

// função que busca citação
async function carregarCitacao() {

    citacaoEl.textContent = "Carregando..."
    autorEl.textContent = ""

    const { data, error } = await supabaseClient.rpc("obter_citacao_musical_aleatoria")

    if(error){
        citacaoEl.textContent = "Erro ao carregar citação"
        console.log(error)
        return
    }

    citacaoEl.textContent = data[0].texto
    autorEl.textContent = "— " + data[0].autor
}

// botão para nova citação
botao.addEventListener("click", carregarCitacao)

// carregar primeira citação ao abrir página
carregarCitacao()

</script>

</body>
</html>
